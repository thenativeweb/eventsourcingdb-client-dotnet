name: QA

on: pull_request

concurrency:
  group: qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (${{ matrix.image-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        image-tag: ['latest', 'preview']

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
      - name: Use .NET 8.0
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Use .NET 9.0
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Use .NET 10.0
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Run QA
        env:
          EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}
        run: make qa
