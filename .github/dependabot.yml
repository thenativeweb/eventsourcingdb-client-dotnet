version: 2
updates:
  - package-ecosystem: nuget
    directory: "/src/EventSourcingDb"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - goloroden
    labels:
      - Dependencies
    allow:
      - dependency-type: direct
    commit-message:
      prefix: fix
    ignore:
      # Microsoft.Extensions follows the oldest target framework, net10.0, so
      # that the SDK does not force newer packages on an application than its
      # platform brings. Lift this together with the major version that drops
      # net10.0, when .NET 10 leaves support on Nov 14, 2028.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Pipelines"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: "/src/EventSourcingDb.Tests"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - goloroden
    labels:
      - Dependencies
    allow:
      - dependency-type: direct
    commit-message:
      prefix: chore
    ignore:
      # Microsoft.Extensions follows the oldest target framework, net10.0, so
      # that the SDK does not force newer packages on an application than its
      # platform brings. Lift this together with the major version that drops
      # net10.0, when .NET 10 leaves support on Nov 14, 2028.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Pipelines"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/docker"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - goloroden
    labels:
      - Dependencies
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees:
      - goloroden
    labels:
      - Dependencies
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
